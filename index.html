<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наше Весілля - 19 Липня 2026</title>
    <style>
        :root {
            --primary: #4a5d4e; /* Sage green */
            --accent: #d4af37;  /* Soft gold */
            --text: #2d2d2d;
            --bg: #fdfbf7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Playfair Display', Georgia, serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            text-align: center;
        }

        header {
            padding: 100px 20px;
            background: linear-gradient(rgba(253,251,247,0.8), rgba(253,251,247,0.95)), url('hero-bg.jpg') center/cover;
        }

        h1 { font-size: 3rem; margin-bottom: 10px; color: var(--primary); }
        .date { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 30px; }

        #countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px auto;
            max-width: 400px;
        }

        .time-box {
            background: white;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1;
        }

        .time-box span { display: block; font-size: 1.8rem; font-weight: bold; color: var(--primary); }
        .time-box label { font-size: 0.8rem; text-transform: uppercase; color: #777; }

        section { padding: 80px 20px; max-width: 800px; margin: 0 auto; }
        h2 { font-size: 2rem; margin-bottom: 20px; color: var(--primary); position: relative; }
        h2::after { content: ''; display: block; width: 50px; height: 2px; background: var(--accent); margin: 10px auto 0; }

        .form-group { margin-bottom: 20px; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: sans-serif; }

        button {
            background-color: var(--primary);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            max-width: 500px;
        }
        button:hover { background-color: #38463b; }

        .secondary-btn {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            margin-bottom: 25px;
            padding: 10px 20px;
        }
        .secondary-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        .guest-separator {
            border: 0;
            border-top: 1px dashed #ccc;
            margin: 25px auto;
            max-width: 500px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Наше Весілля</h1>
        <p class="date">19 ЛИПНЯ 2026 РОКУ</p>
        <p>З нетерпінням чекаємо на святкування разом з вами!</p>
        
        <div id="countdown">
            <div class="time-box"><span id="days">00</span><label>Днів</label></div>
            <div class="time-box"><span id="hours">00</span><label>Годин</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Хвилин</label></div>
        </div>
    </header>

    <section id="details">
        <h2>Деталі</h2>
        <p><strong>Церемонія:</strong> 16:00 | Місце вінчання</p>
        <p><strong>Вечеря:</strong> 18:00 | Ресторан</p>
        <p style="margin-top: 15px;"><em>Дрес-код: Офіційний</em></p>
    </section>

    <section id="rsvp">
        <h2>Підтвердження участі</h2>
        <form id="rsvpForm">
            <div id="guestList">
                <div class="guest-entry">
                    <hr class="guest-separator">
                    <div class="form-group">
                        <label>Ім'я та Прізвище</label>
                        <input type="text" class="guest-name" required placeholder="Ваше ім'я">
                    </div>
                    <div class="form-group">
                        <label>Чи зможете ви прийти?</label>
                        <select class="guest-attendance" required>
                            <option value="">Оберіть варіант</option>
                            <option value="Із радістю прийду">Із радістю прийду</option>
                            <option value="На жаль, не зможу">На жаль, не зможу</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="button" id="addGuestBtn" class="secondary-btn">+ Додати ще одного гостя</button>
            <br>
            <button type="submit" id="submitBtn">Відправити</button>
        </form>
    </section>

    <script>
        // TARGET WEDDING DATE
        const weddingDate = new Date('July 19, 2026 16:00:00').getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById('countdown').innerHTML = "<h3>Цей день настав!</h3>";
            }
        }, 1000);

        // Dynamic Guest Logic
        document.getElementById('addGuestBtn').addEventListener('click', function() {
            const guestList = document.getElementById('guestList');
            const firstGuest = guestList.querySelector('.guest-entry').cloneNode(true);
            
            // Clear the inputs for the new guest
            firstGuest.querySelector('.guest-name').value = '';
            firstGuest.querySelector('.guest-attendance').value = '';
            
            // Show the dashed separator line for subsequent guests
            firstGuest.querySelector('.guest-separator').style.display = 'block'; 
            
            guestList.appendChild(firstGuest);
        });

        // PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE:
        const WEB_APP_URL = 'YOUR_COPIED_APPS_SCRIPT_WEB_APP_URL';

        const form = document.getElementById('rsvpForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Відправлення...';

            // Collect all guest names and attendances into comma-separated strings
            const names = Array.from(document.querySelectorAll('.guest-name'))
                               .map(input => input.value).join(', ');
            const attendances = Array.from(document.querySelectorAll('.guest-attendance'))
                                   .map(select => select.value).join(', ');

            const formData = new URLSearchParams();
            formData.append('name', names);
            formData.append('attendance', attendances);

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: formData,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    alert('Дякуємо! Вашу відповідь збережено.');
                    // Reset the form and remove extra added guests
                    form.reset();
                    const entries = document.querySelectorAll('.guest-entry');
                    for (let i = 1; i < entries.length; i++) {
                        entries[i].remove();
                    }
                } else {
                    alert('Ой! Щось пішло не так. Будь ласка, спробуйте ще раз.');
                    console.error(data.error);
                }
            })
            .catch(error => {
                alert('Дякуємо! Вашу відповідь збережено.'); 
                form.reset();
                const entries = document.querySelectorAll('.guest-entry');
                for (let i = 1; i < entries.length; i++) {
                    entries[i].remove();
                }
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Відправити';
            });
        });
    </script>
</body>
</html>
